{% extends "base.html" %}

{% block title %}系統登入 - 薪資管理平台{% endblock %}

{% block content %}
<style>
    .login-card {
        max-width: 550px;
        margin: 100px auto;
        background: #ffffff;
        border-radius: 25px;
        border: 4px solid #1a365d; /* 使用品牌深藍色加粗邊框 */
        box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        overflow: hidden;
    }
    .login-header {
        background: #1a365d;
        color: white;
        padding: 40px 20px;
        text-align: center;
    }
    .login-header i { font-size: 50px; margin-bottom: 15px; }
    .login-header h2 { color: #ffffff !important; border: none; padding: 0; margin: 0; font-size: 32px; }

    .login-body { padding: 50px 40px; }
    
    /* 登入輸入框特別強化 */
    .login-input {
        font-size: 26px !important;
        padding: 18px 20px !important;
        border: 3px solid #cbd5e0 !important;
        border-radius: 15px !important;
        margin-bottom: 25px !important;
        width: 100%;
        background: #f8fafc;
    }
    .login-input:focus {
        border-color: #2b6cb0 !important;
        background: #ffffff;
        box-shadow: 0 0 0 8px rgba(43, 108, 176, 0.1) !important;
        outline: none;
    }

    .btn-login {
        width: 100%;
        padding: 20px !important;
        font-size: 28px !important;
        font-weight: bold;
        background: #2b6cb0;
        color: white;
        border-radius: 15px;
        border: none;
        transition: 0.3s;
        box-shadow: 0 8px 15px rgba(43, 108, 176, 0.3);
    }
    .btn-login:hover { transform: translateY(-3px); background: #2c5282; }
</style>

<div class="login-card">
    <div class="login-header">
        <i class="fa-solid fa-lock-open"></i>
        <h2>管理員登入</h2>
    </div>
    <div class="login-body">
        <form method="POST">
            <label class="form-label mb-2"><i class="fa-solid fa-user"></i> 使用者帳號</label>
            <input type="text" name="userid" id="userid" class="login-input" placeholder="請輸入帳號" required autofocus>
            
            <label class="form-label mb-2"><i class="fa-solid fa-key"></i> 登入密碼</label>
            <input type="password" name="password" id="password" class="login-input" placeholder="請輸入密碼" required>
            
            <button type="submit" class="btn-login">
                安全登入 <i class="fa-solid fa-circle-right ms-2"></i>
            </button>
        </form>
        <p class="text-center mt-4 text-muted" style="font-size: 18px;">
            <i class="fa-solid fa-shield-halved"></i> 薪資系統受安全加密保護
        </p>
    </div>
</div>
{% endblock %}
