{% extends "base.html" %}
{% block title %}編輯員工資料{% endblock %}
{% block content %}
<style>
    /* 容器美化：深色外框與專業陰影 */
    .form-container {
        background: #ffffff;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        max-width: 950px;
        margin: 40px auto;
        border: 3px solid #2d3748;
    }

    /* 標題與分組 */
    h1 {
        color: #1a365d;
        font-size: 32px;
        font-weight: bold;
        border-bottom: 4px solid #2b6cb0;
        padding-bottom: 15px;
        margin-bottom: 30px;
    }

    h4 {
        color: #2c5282;
        font-weight: bold;
        margin-top: 20px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    /* 標籤字體加大 */
    .form-label {
        font-size: 22px;
        font-weight: bold;
        color: #2d3748;
        margin-bottom: 8px;
    }

    /* ✨ 輸入框強化：加深邊框與焦點顏色 */
    .form-control, .form-select {
        font-size: 22px !important;
        padding: 12px 15px !important;
        border: 2.5px solid #4a5568 !important; /* 較深的預設邊框 */
        border-radius: 10px;
        background-color: #ffffff;
        transition: all 0.2s ease-in-out;
    }

    /* 點擊時的高亮效果 */
    .form-control:focus, .form-select:focus {
        border-color: #2b6cb0 !important;
        box-shadow: 0 0 0 5px rgba(43, 108, 176, 0.2) !important;
        background-color: #fff;
        outline: none;
    }

    /* 分隔線 */
    hr {
        border-top: 3px solid #cbd5e0;
        opacity: 1;
        margin: 40px 0;
    }

    /* 按鈕加大 */
    .btn-lg-custom {
        font-size: 26px !important;
        padding: 15px 40px !important;
        font-weight: bold;
        border-radius: 15px;
    }

    /* 唯讀欄位提示（如 ID 通常不可改） */
    .form-control[readonly] {
        background-color: #edf2f7;
        border-color: #cbd5e0 !important;
        cursor: not-allowed;
    }
</style>

<div class="form-container">
    <h1><i class="fa-solid fa-user-pen"></i> 編輯基本資料: {{ employee.employee_name }}</h1>
    
    <div class="mb-4">
        <a href="{{ url_for('employee_manage') }}" class="btn btn-secondary px-4 py-2" style="font-size: 20px;">
            <i class="fa-solid fa-arrow-left"></i> 返回員工管理
        </a>
    </div>

    <form method="POST">
        <div class="row">
            <div class="col-md-6 mb-4">
                <label class="form-label">員工編號 <span class="text-danger">*</span></label>
                <input type="text" name="employee_id" class="form-control" value="{{ employee.employee_id }}" required readonly>
            </div>
            <div class="col-md-6 mb-4">
                <label class="form-label">員工姓名 <span class="text-danger">*</span></label>
                <input type="text" name="employee_name" class="form-control" value="{{ employee.employee_name }}" required>
            </div>
            <div class="col-md-6 mb-4">
                <label class="form-label">身份證字號</label>
                <input type="text" name="employee_card" class="form-control" value="{{ employee.employee_card }}">
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-4">
                <label class="form-label">出生日期</label>
                <input type="date" name="employee_birth" class="form-control" value="{{ employee.employee_birth }}">
            </div>
            <div class="col-md-6 mb-4">
                <label class="form-label">到職日期</label>
                <input type="date" name="employee_onboard" class="form-control" value="{{ employee.employee_onboard }}">
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-4">
                <label class="form-label">職位名稱<span class="text-danger">*</span></label>
                    <select name="position" class="form-select" required>
                        <option value="">請點擊選擇職位</option>
                        <option value="居服"    {% if employee.position == '居服'    %}selected{% endif %}>居服</option>
                        <option value="行政"    {% if employee.position == '行政'    %}selected{% endif %}>行政</option>
                    </select>
            </div>
        </div>
        <hr>

        <h4><i class="fa-solid fa-shield-halved"></i> 固定保險級距設定</h4>
        <div class="row">
            <div class="col-md-6 mb-4">
                <label class="form-label">級距年份</label>
                <select name="insurance_year" id="insurance_year" class="form-select" onchange="loadAllGrades()">
                    {% for year in labor_years %}
                    <option value="{{ year }}" {% if year == selected_labor_year %}selected{% endif %}>{{ year }} 年</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-4">
                <label class="form-label">勞保級距</label>
                <select name="labor_insurance_grade" id="labor_insurance_grade" class="form-select">
                    {% for level in labor_levels %}
                    <option value="{{ level.range }}" {% if employee.labor_insurance_grade == level.range %}selected{% endif %}>
                        {{ level.range }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-4">
                <label class="form-label">健保級距</label>
                <select name="health_insurance_grade" id="health_insurance_grade" class="form-select">
                    {% for level in health_levels %}
                    <option value="{{ level.Range }}" {% if employee.health_insurance_grade == level.Range %}selected{% endif %}>
                        {{ level.Range }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <hr>

        <h4><i class="fa-solid fa-users"></i> 健保投保與眷屬設定</h4>
        <div class="row">
            <div class="col-md-6 mb-4">
                <label class="form-label">投保身分 (本人+眷口)</label>
                <select name="qualification" class="form-select">
                    <option value="0" {% if employee.qualification == 0 %}selected{% endif %}>本人</option>
                    <option value="1" {% if employee.qualification == 1 %}selected{% endif %}>本人 + 1 眷口</option>
                    <option value="2" {% if employee.qualification == 2 %}selected{% endif %}>本人 + 2 眷口</option>
                    <option value="3" {% if employee.qualification == 3 %}selected{% endif %}>本人 + 3 眷口</option>
                </select>
            </div>
            <div class="col-md-6 mb-4">
                <label class="form-label">本人補助身分</label>
                <select name="subsidy" class="form-select">
                    <option value="0" {% if employee.subsidy == 0 %}selected{% endif %}>無補助 (一般)</option>
                    <option value="2" {% if employee.subsidy == 2 %}selected{% endif %}>補助 1/2</option>
                    <option value="4" {% if employee.subsidy == 4 %}selected{% endif %}>補助 1/4</option>
                    <option value="5" {% if employee.subsidy == 5 %}selected{% endif %}>全額補助</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-4">
                <label class="form-label">眷口-不補助人數</label>
                <input type="number" name="subsidy_none" class="form-control" value="{{ employee.subsidy_none }}">
            </div>
            <div class="col-md-4 mb-4">
                <label class="form-label">眷口-補助 1/2 人數</label>
                <input type="number" name="subsidy_half" class="form-control" value="{{ employee.subsidy_half }}">
            </div>
            <div class="col-md-4 mb-4">
                <label class="form-label">眷口-全額補助人數</label>
                <input type="number" name="subsidy_full" class="form-control" value="{{ employee.subsidy_full }}">
            </div>
        </div>

        <hr>

        <h4><i class="fa-solid fa-calendar-check"></i> 特休發放設定</h4>
        <div class="mb-5">
            <label class="form-label">每年特休發放月份</label>
            <select name="leave_payment_month_of_year" class="form-select">
                <option value="" {% if not employee.leave_payment_month_of_year %}selected{% endif %}>
                    -- 請選擇月份 (若不選擇將預設為 1 月) --
                </option>
                {% for m in range(1, 13) %}
                <option value="{{ m }}" {% if employee.leave_payment_month_of_year == m %}selected{% endif %}>
                    每年 {{ m }} 月
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg-custom shadow">
                <i class="fa-solid fa-cloud-arrow-up"></i> 儲存修改內容
            </button>
        </div>
        
    <script>
    function loadAllGrades() {
        const year = document.getElementById('insurance_year').value;
        const laborSelect = document.getElementById('labor_insurance_grade');
        const healthSelect = document.getElementById('health_insurance_grade');
        const currentLaborGrade = "{{ employee.labor_insurance_grade }}";
        const currentHealthGrade = "{{ employee.health_insurance_grade }}";

        laborSelect.innerHTML = '<option>載入中...</option>';
        healthSelect.innerHTML = '<option>載入中...</option>';

        // 同時發出兩個請求
        Promise.all([
            fetch(`/get_labor_insurance_levels/${year}`).then(r => r.json()),
            fetch(`/get_health_insurance_levels/${year}`).then(r => r.json())
        ])
        .then(([laborLevels, healthLevels]) => {
            // 填入勞保
            laborSelect.innerHTML = '';
            laborLevels.forEach(l => {
                const opt = document.createElement('option');
                opt.value = l.range;
                opt.textContent = l.range;
                if (String(l.range) === String(currentLaborGrade)) opt.selected = true;
                laborSelect.appendChild(opt);
            });

            // 填入健保
            healthSelect.innerHTML = '';
            healthLevels.forEach(l => {
                const opt = document.createElement('option');
                opt.value = l.Range || l.range;
                opt.textContent = l.Range || l.range;
                if (String(l.Range || l.range) === String(currentHealthGrade)) opt.selected = true;
                healthSelect.appendChild(opt);
            });
        })
        .catch(() => {
            laborSelect.innerHTML = '<option>載入失敗</option>';
            healthSelect.innerHTML = '<option>載入失敗</option>';
        });
    }
    </script>
    </form>
</div>
{% endblock %}
